name: Set up Build Tools
description: Set up and configure Java and Gradle
inputs:
  publish-caches:
    description: Whether this job shall be used to update the caches
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: 21
        distribution: temurin
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.publish-caches != 'true' }}
        validate-wrappers: false
        cache-provider: basic
